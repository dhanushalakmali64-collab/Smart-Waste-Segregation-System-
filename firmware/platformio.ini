; Smart Bin firmware for the AI-Thinker ESP32-CAM
; Open this "firmware" folder in VS Code with the PlatformIO extension, then Upload.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
